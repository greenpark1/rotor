    ctx.quadraticCurveTo(sx + size, sy + size, sx + size - r, sy + size);
    ctx.lineTo(sx + r, sy + size);
    ctx.quadraticCurveTo(sx, sy + size, sx, sy + size - r);
    ctx.lineTo(sx, sy + r);
    ctx.quadraticCurveTo(sx, sy, sx + r, sy);
    ctx.closePath();
}
function roundedSq(sx, sy, size, fill, stroke, strokeW) {
    const r = Math.min(size * 0.22, 8);
    ctx.beginPath();
    ctx.moveTo(sx + r, sy);
    ctx.lineTo(sx + size - r, sy);
    ctx.quadraticCurveTo(sx + size, sy, sx + size, sy + r);
    ctx.lineTo(sx + size, sy + size - r);
    ctx.quadraticCurveTo(sx + size, sy + size, sx + size - r, sy + size);
    ctx.lineTo(sx + r, sy + size);
    ctx.quadraticCurveTo(sx, sy + size, sx, sy + size - r);
    ctx.lineTo(sx, sy + r);
    ctx.quadraticCurveTo(sx, sy, sx + r, sy);
    ctx.closePath();
    if (fill)   { ctx.fillStyle   = fill;   ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = strokeW || 2; ctx.stroke(); }
}
function lightenHex(hex, k) {
    let h = hex.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join('');
    const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
    const m = v => Math.round(v + (255 - v) * k);
    return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function shadeHex(hex, k) {
    let h = hex.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join('');
    const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
    const m = v => Math.round(v * k);
    return `rgb(${m(r)},${m(g)},${m(b)})`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER
   ═════════════════════════════════════════════════════════════════════════ */
const CELL_INSET = 2;
const CELL_SIZE  = CELL - CELL_INSET * 2;
/* Unoccupied cells are drawn 20% smaller than the cell they sit in, centred.
   More air between them, and it leaves the grid intersections clear for the
   joints to sit in rather than crowding them. */
const FLOOR_K    = 0.9;
const FLOOR_SIZE = CELL_SIZE * FLOOR_K;
const FLOOR_OFF  = (CELL_SIZE - FLOOR_SIZE) / 2;
/* Near-white rather than slate. It was rgba(100,116,139,.30), a mid grey that
   sat only a little above the board it was drawn on — fine when a bright lip
   marked every rim, and not fine now that these outlines carry the whole read.
   One constant because every cell state draws the same outline; only what is
   filled inside it differs. */
/* ── ONE BOX, AND EVERYTHING DRAWS INSIDE IT ──────────────────────────────
   Designer's call: every game object stays within the confines of its cell and
   nothing overlaps, no exceptions. Before this there were four different
   sizes on the board — the floor square at 35.2px, the player cube and plugs
   at 40px, greens and walls at 44px, and walls additionally GREW by CELL_INSET
   into each neighbour they touched, deliberately closing the gap so a run of
   walls read as one mass. Four sizes meant nothing lined up with anything, and
   the wall growth meant an object was drawing in a cell that was not its own.

   BOX_OFF and BOX are now the only two numbers any cell-bound object uses.
   Anything drawn in a cell starts at col*CELL + BOX_OFF and is BOX across; if
   it wants to be smaller it insets from there, and nothing is ever larger.
   FLOOR_K went 0.8 -> 0.9 at the same time, which grows every cell and closes
   the gap between them from 12.8px to 8.4px. */
const BOX_OFF = CELL_INSET + FLOOR_OFF;
const BOX     = FLOOR_SIZE;
const CELL_OUTLINE = 'rgba(226,232,240,0.46)';
/* Ground is a LID over a window, not a solid floor. Every cell on the board is
   clipped through to the space below; this fill is the frosting on the ones
   you can stand on. At 0.60 the layers still read through a ground cell — the
   drift is visible if you look — and a void, with no lid at all, shows the
   same view at full strength.

   So the difference between ground and hole is not WHETHER you can see down.
   It is how clearly. That is a softer signal than a lip or a slab, and it is
   the one the designer asked for; it wants checking on the phone.

   The three states of a cell, all sharing one outline:
       ground, unwalked   outline + lid
       ground, covered    outline + lid + the pale occupied shade
       void               outline, and the window wide open */
const GROUND_FILL = 'rgba(13,20,36,0.60)';
/* The shade laid over a square you have covered. It was 0.16, which on top of
   the lid left 34% of the layer below showing against an unwalked cell's 40% —
   a six-point difference nobody could see, so covering ground changed almost
   nothing about how it looked. At 0.48 the two are properly distinct: an
   unwalked cell is a window you can see down through, a covered one is nearly
   filled in. Coverage now has a visible consequence, which it should, because
   in main it is what pays the clock. */
const COVERED_FILL = 'rgba(148,163,184,0.48)';
/* How far a hole's lip stops short of a grid intersection. Must exceed the
   joint mark's outer radius, or the two are confusable at board scale. */
const LIP_GAP    = 12;

/* ── ONE SPACE UNDER THE WHOLE BOARD ───────────────────────────────────────
   Designer's call: every hole is a window onto the same continuous space
   below, not a box with its own back wall. That single decision is what makes
   the board read as a slab floating over something rather than as a sheet with
   pits punched in it — two holes on screen show the same underworld sliding
   past at the same rate, so the space is understood to run on behind the
   ground between them.

   Mechanically it is one clip region built from every visible void cell and
   ONE grid drawn through all of them, which is also why it is cheap.

   ── THE PARALLAX IS THE DEPTH CUE ──────────────────────────────────────────
   Not the drawing. A grid drawn at the same scroll rate is wallpaper; the same
   grid at a third of the rate is unmistakably far away, because motion
   disparity is the cue the eye actually trusts. Hence the drift velocities
   doing the work and the scales only supporting them.

   ── WHAT CARRIES DEPTH, AFTER EVERYTHING ELSE WAS TRIED AND CUT ────────────
   Two cues, and nothing else at all:

     · TWO LAYERS of the board's own cells, the far one smaller, thinner and
       fainter than the near one
     · the DRIFT — both rising, at different rates, detached from the board's
       scroll entirely, so the board falls past something that is barely moving

   Cut along the way, in order: the vignette, the ring where the wash met solid
   ground, the light falling in, the wash itself, the clip that confined it to
   holes, the white lip, and the slab edge. Every one of them was a way of
   saying "there is a hole here", and the board says it better by simply not
   drawing a cell. ─────────────────────────────────────────────────────────── */
/* ── TWO LAYERS, DRIFTING ON THEIR OWN CLOCK ───────────────────────────────
   Designer's call: see THROUGH to the layer below; put a much smaller grid
   beneath it; thinner and fainter the further down it goes; and move it in a
   direction of its own rather than following the board down.

   WHY IT WAS NOT WORKING, when it first went in. Not the grid — the wash on
   top of it. At 0.88 opacity across the 88% of void cells that sit against a
   rim, a line drawn at 0.26 alpha arrives at about 3% contrast: drawn
   correctly, then painted out. Lightening the wash is what let anything be
   seen at all, and it has since been removed altogether, so these layers are
   now shown at their own weights and nothing sits over them.

   THE STACK. Two grids, and the far one is smaller, thinner, fainter and
   slower in all four respects at once — that consistency is what makes it read
   as distance rather than as a second pattern.

   THE DRIFT IS THE REAL DEPTH CUE. Both layers are now DETACHED from
   game.cameraY and move on wall-clock time instead, so scrolling the board
   does not drag them along: the board rushes down past something that is
   barely moving, which is how distance actually looks. They drift in
   DIFFERENT directions from each other and from the board — near goes up and
   left, far goes up and right, both very slowly — and it is that differential
   between the two, more than any amount of drawing, that sells the space. */
/* Up 30% again, both layers this time (0.42 -> 0.55, 0.22 -> 0.29). The motif
   has to survive being small or the layer stops being "the same cells further
   away" and becomes texture — and with the alphas coming down at the same
   time, size is what keeps it readable as it fades. */
const UNDER_A_SCALE = 0.55;   const UNDER_B_SCALE = 0.29;   // cell size, near / far
/* ── THE LADDER, MEASURED AGAINST THE TOP LAYER ────────────────────────────
   The foreground cell is drawn at 1.5px and 46% (see the roundedSq call in the
   floor pass — if that changes, these want changing with it).

       top    1.5px  46%
       near   1.3px  32%
       far    1.05px 22%

   Near was 0.9px, which is 60% of the top layer's width — not "slightly
   thinner" but obviously thinner, and it made the layer read as a different
   kind of mark rather than the same mark further off. At 1.3 it is a hair
   under the top and the two are plainly the same object.

   The fading then does the separating instead, and it has to work harder now
   that the widths are close: near drops to 32%, a fraction below where it was,
   because the extra width would otherwise have made it louder overall.

   ONE THING TO WATCH. These are ABSOLUTE widths, as asked. A 1.05px line on
   the far layer's 8px cell is proportionally far heavier than 1.5px on the
   top layer's 35px cell, so the far layer is drawn in bolder relative terms
   than the board is. Scaling the widths with the tiles instead would put far
   at about 0.34px, which is close to invisible — so absolute is almost
   certainly right here, but it is a choice and not an accident. */
/* Both alphas cut 20% (0.32 -> 0.26, 0.22 -> 0.18). Brief: "just about
   discernible" — present when you look for it, not competing when you are
   reading the board. */
const UNDER_A_ALPHA = 0.26;   const UNDER_B_ALPHA = 0.18;   // line alpha
const UNDER_A_WIDTH = 1.3;    const UNDER_B_WIDTH = 1.05;   // line width
/* ── NOTHING DOWN HERE MOVES SIDEWAYS. BOTH LAYERS, ZERO. ──────────────────
   Asked for three times before it was done right, because I kept reading "the
   layer below" as the far one of the two rather than as the whole underworld.
   The far layer's VX went to 0 two builds ago and the near layer carried on
   sliding left at 2.6px/s the entire time, which is what was actually on
   screen. Both are 0 now. There is no horizontal term anywhere in this layer.

   Vertical only, and at different rates — near rises faster than far, and both
   run against the board coming down. That difference is the entire depth cue
   and it does not need a second axis to work. */
/* Both rates cut 30% (4.2 -> 2.94, 1.6 -> 1.12). The ratio between them is
   what reads as depth, so they are scaled together rather than separately. */
const UNDER_A_VX    = 0;      const UNDER_A_VY    = -2.94;  // px/sec, straight up
const UNDER_B_VX    = 0;      const UNDER_B_VY    = -1.12;  // px/sec, straight up, slower

/* ── CALIBRATED AGAINST THE HOLES THAT EXIST, NOT THE ONES I TESTED WITH ───
   UNDER_FADE was 3.0, tuned on a hand-built 7x7 hole. Then it was measured on
   real generated terrain: 88% of void cells sit ONE cell from a rim and NONE
   ever reach three, because the generator makes chasms 3-4 rows deep and a
   3-deep chasm's middle row is 1 from the rim above and 1 from the rim below.
   The fade was calibrated for a hole the game never produces, so the layer was
   showing through at 7% almost everywhere — invisible, and the reason it
   looked like nothing was happening.

   At 1.0 the ladder matches the terrain: a one-row trench is all rim and stays
   a near-black slot, and the middle of a real chasm opens up properly. */
/* ── WHAT THE HOLES ARE MADE OF: NOTHING ───────────────────────────────────
   Four things were tried on top of the space below and all four are gone, in
   this order: a vignette darkening toward each rim; an opaque ring where the
   wash met solid ground; the light falling in over the top rim; and finally
   the flat wash itself, along with the clip that confined it to holes.

   What replaced them is the simplest possible statement of the same idea. The
   top layer is transparent except its cells. The space below shows through
   everywhere. A hole is a place where no cell is drawn — not a painted
   object, not a window, just an absence in the lattice.

   Everything that used to announce a hole has now been removed at the
   designer's call: the white lip round its edge, the slab cut into its top,
   the wash inside it. The gap read rests entirely on cells being present or
   absent, which is worth watching against kill criterion 1 on the phone. */



/* The underworld itself: clip to every visible hole, then draw one grid
   through the lot. Cool and desaturated on purpose — the board above is warm
   slate, so temperature alone separates "ground" from "not ground" even at
   thumbnail size and even for a colour-blind player. */

/* One tile per layer, built once and kept. The tile IS the foreground's
   unoccupied cell — same rounded square, same proportions, same corner radius
   as roundedSq() draws at full size — so the space below is made of the board's
   own cells rather than of some other pattern that happens to be behind it. */
const underPatterns = {};
function underPattern(P, alpha, width) {
    const key = `${P}|${alpha}|${width}`;
    if (underPatterns[key] !== undefined) return underPatterns[key];
    const c = document.createElement('canvas');
    c.width = P; c.height = P;
    const g = c.getContext('2d');
    /* 0.72 is the foreground ratio carried down: a cell is CELL wide, its
       inner box is CELL - 2*CELL_INSET, and the floor square is FLOOR_K of
       that — 0.8 * 36/40 for a 40px cell. Keeping the ratio is what makes the
       two layers read as the same object at different distances. */
    const size = P * 0.72, off = (P - size) / 2;
    const r = Math.min(size * 0.22, 8);
    g.strokeStyle = `rgba(104,142,190,${alpha})`;
    g.lineWidth = width;
    g.beginPath();
    g.moveTo(off + r, off);
    g.lineTo(off + size - r, off);
    g.quadraticCurveTo(off + size, off, off + size, off + r);
    g.lineTo(off + size, off + size - r);
    g.quadraticCurveTo(off + size, off + size, off + size - r, off + size);
    g.lineTo(off + r, off + size);
    g.quadraticCurveTo(off, off + size, off, off + size - r);
    g.lineTo(off, off + r);
    g.quadraticCurveTo(off, off, off + r, off);
    g.closePath();
    g.stroke();
    const p = ctx.createPattern(c, 'repeat') || null;
    underPatterns[key] = p;
    return p;
}

function drawUnderworld(camInt, camFrac) {
    /* ── TWO SHAPES OF WINDOW, AND THE DIFFERENCE IS THE POINT ─────────────
       Ground cells are clipped to their ROUNDED BOX: the space below shows
       through each one as a discrete tile, dimmed by that cell's lid, and the
       8.4px gutter between them stays solid board. That gutter is why this is
       a clip and not a transparent background — fully transparent, the layers
       came through every gap and put a grid of bright seams over the screen.

       Void cells are clipped to their FULL GRID SQUARE, gutter included, and
       draw no cell at all. Because the squares of neighbouring voids share
       their edges, they merge into ONE continuous opening: a 3x3 chasm is a
       single hole in the board, not nine rounded tiles arranged in a square.
       That is the whole reason the two use different shapes — clipped to
       boxes, a chasm would read as a patch of separate holes and its true
       extent would be guesswork. ──────────────────────────────────────────── */
    const ground = [], holes = [];
    for (let row = -1; row <= VIEW_H + 1; row++) {
        const wy = camInt + row;
        for (let col = 0; col < VIEW_W; col++) {
            const y = (row - camFrac) * CELL;
            if (world[`${col},${wy}`] === 'void') holes.push([col * CELL, y]);
            else ground.push([col * CELL + BOX_OFF, y + BOX_OFF]);
        }
    }

    ctx.save();
    ctx.beginPath();
    for (const [x, y] of ground) roundedSqPath(x, y, BOX);
    for (const [x, y] of holes)  ctx.rect(x, y, CELL, CELL);
    ctx.clip();

    ctx.fillStyle = '#050912';
    ctx.fillRect(-5, -5, LOGICAL_W + 10, LOGICAL_H + 10);

    /* Wall-clock seconds, not cameraY — the layers keep moving when the board
       is still, and stay put when it races. `wrap` keeps the offset inside one
       cell so the drift never runs the pattern off anywhere. */
    const t = performance.now() / 1000;
    const wrap = (v, m) => { let r = v % m; return r > 0 ? r - m : r; };

    /* THE SAME CELLS, FURTHER AWAY. Designer's call: what you see through a
       hole must be a version of the board's own gridded cells, not a different
       object. It was a plain ruled lattice, which read as graph paper behind a
       game rather than as more of the game a long way down.

       So the tile is the foreground's unoccupied cell, exactly — a rounded
       square at 80% of the cell box with the same 0.22 corner radius — just
       smaller, thinner and fainter. Nothing new is invented down there.

       Drawn as a cached repeating PATTERN rather than thousands of paths: the
       far layer alone would be about 4,000 rounded rects a frame built by hand,
       which is real work on a phone for something nobody is looking straight
       at. One tile, stamped, translated for the drift. */
    const layer = (S, alpha, width, vx, vy) => {
        const P = Math.max(3, Math.round(S));
        const pat = underPattern(P, alpha, width);
        if (!pat) return;
        const ox = wrap(t * vx, P), oy = wrap(t * vy, P);
        ctx.save();
        ctx.translate(ox, oy);
        ctx.fillStyle = pat;
        ctx.fillRect(-ox - P, -oy - P, LOGICAL_W + 2 * P, LOGICAL_H + 2 * P);
        ctx.restore();
    };

    // Far first, so the near cells overlay it rather than the other way round.
    layer(CELL * UNDER_B_SCALE, UNDER_B_ALPHA, UNDER_B_WIDTH, UNDER_B_VX, UNDER_B_VY);
    layer(CELL * UNDER_A_SCALE, UNDER_A_ALPHA, UNDER_A_WIDTH, UNDER_A_VX, UNDER_A_VY);

    /* The wash is gone with the clip. It existed to darken the space seen
       through a hole so the hole read as a hole; with the backdrop showing
       everywhere there is nothing to single out, and a flat dimming layer
       over the whole board would only mute the thing it is sitting on. */
    ctx.restore();
}

function draw() {
    ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
    ctx.save();
    ctx.translate(shake.x, shake.y);
    /* The board is OPAQUE again. It went transparent so the space below could
       show everywhere, which also meant it showed through the 8.4px gutter
       between every pair of cells — a grid of thin bright seams over the whole
       screen, which is not what "see down through a hole" should look like.
       The board is solid; only the holes are windows. */
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-5, -5, LOGICAL_W + 10, LOGICAL_H + 10);

    const camInt = Math.floor(game.cameraY);
    const camFrac = game.cameraY - camInt;
    const playerNow = new Set(getPlayerCells().map(c => `${c.x},${c.y}`));
    const now = performance.now();

    /* The underworld goes down first and unclipped: it IS the background, and
       everything after this puts cells on top of it. */
    drawUnderworld(camInt, camFrac);

    for (let row = -1; row <= VIEW_H + 1; row++) {
        const worldY = camInt + row;
        for (let col = 0; col < VIEW_W; col++) {
            const key = `${col},${worldY}`;
            const sx = col * CELL + CELL_INSET;
            const sy = (row - camFrac) * CELL + CELL_INSET;
            const item = world[key];

            /* A VOID IS THE ABSENCE OF A CELL. No lid, no shade, no outline —
               nothing is drawn here at all, and what you see is the layer
               below, uninterrupted across however many void cells adjoin.

               It briefly kept an outline, on the reasoning that a hole with no
               mark at all could not be told from the gutter. The clip settles
               that instead: a void opens its full grid square, gutter and all,
               so a hole is visibly WIDER than the lattice rather than being
               one more cell in it. Nothing needs to be drawn to say so. */
            if (item === 'void') continue;

            if (playerNow.has(key)) continue;

            if (item === 'wall') {
                /* Walls used to grow CELL_INSET into every neighbouring wall
                   so a run of them fused into one mass. That is exactly the
                   overlap that is no longer allowed: a wall now occupies its
                   own box and nothing else, and a run of them reads as a row
                   of blocks rather than a wall. */
                const wX = sx + FLOOR_OFF, wY = sy + FLOOR_OFF;
                roundedSq(wX, wY, BOX, '#475569', 'rgba(148,163,184,0.28)', 1);
            } else if (item === 'green') {
                // The way off an island. Bright enough to be the reason you
                // looked at the island in the first place.
                const pulse = 0.55 + 0.45 * Math.sin(now / 380);
                const gX = sx + FLOOR_OFF, gY = sy + FLOOR_OFF, gIn = BOX * 0.14;
                roundedSq(gX, gY, BOX, 'rgba(163,230,53,0.20)', null);
                ctx.save();
                ctx.globalAlpha = pulse;
                roundedSq(gX + gIn, gY + gIn, BOX - gIn * 2, '#a3e635', null);
                ctx.restore();
                roundedSq(gX, gY, BOX, null, 'rgba(163,230,53,0.75)', 2);
            } else {
                /* ── THE OUTLINE IS THE CELL; THE FILL IS ITS STATE ─────────
                   Covering a square used to REPLACE its outline with a soft
                   fill, so the moment you claimed a cell it stopped being
                   drawn as a cell and became a smudge. Wrong on its own terms:
                   the square is still there, still ground, still part of the
                   lattice — all that has changed is that you have been on it.

                   Now everything stacks in one order, for every cell on the
                   board: the lid, then whatever the cell's state adds, then
                   the outline last so nothing ever paints over it. */
                roundedSq(sx + FLOOR_OFF, sy + FLOOR_OFF, FLOOR_SIZE, GROUND_FILL, null);
                if (visited.has(key))
                    roundedSq(sx + FLOOR_OFF, sy + FLOOR_OFF, FLOOR_SIZE, COVERED_FILL, null);
                roundedSq(sx + FLOOR_OFF, sy + FLOOR_OFF, FLOOR_SIZE, null, CELL_OUTLINE, 1.5);
            }
        }
    }

    /* ── THE LIP IS GONE ────────────────────────────────────────────────────
       A solid tile bordering a void used to get a bright white edge on the
       side facing the drop — 2.5px at 62% — on the argument that it turned
       "how wide is that hole" into "how far apart are those two lines", which
       is an easier read at speed. Designer's call to remove it: at full weight
       it was the loudest thing on the board, and it was drawing a box around
       every hole rather than letting the hole be a hole.

       WHAT MARKS A RIM NOW. Nothing marks it; the terrain shows it. Ordinary
       ground is a field of rounded cells and a hole is where those cells stop,
       so the edge is legible as an absence — helped by the slab cut into the
       top of each hole and by the wash making the space below plainly darker.

       WORTH WATCHING. Kill criterion 1 is gap width being unreadable at speed
       on a phone, and the lip was the main instrument aimed at it. If the gap
       read suffers on the phone test, this is the first thing to bring back —
       thinner and dimmer than it was, rather than at its old weight. */


    /* ── PLAYER ────────────────────────────────────────────────────────── */
    let renderCells = getPlayerCells();
    let renderParity = game.faceParity;
    let flipping = false, flipSX = 1, flipSY = 1, flipAX = 0, flipAY = 0;
    let flipDiag = false, flipAng = 0, flipS = 1, flipLift = 0, flipBShear = 0;

    if (flip.active) {
        const ft = (now - flip.t0) / flip.dur;
        if (ft >= 1) {
            flip.active = false;
            if (pendingResolve) {
                pendingResolve = false;
                // The flip has landed — now find out what it cost. Any cube
                // over a void hangs for a beat, then drops and becomes that
                // cell. Nothing else creates ground.
                resolveSupport();
            }
            renderCells = getPlayerCells();
            renderParity = game.faceParity;
        } else {
            flipping = true;
            let s;
            if (flip.repel) {
                renderCells = flip.fromCells; renderParity = flip.fromParity;
                s = ft < 0.5 ? (1 - ft / 0.5) : ((ft - 0.5) / 0.5);
            } else if (ft < 0.5) { renderCells = flip.fromCells; renderParity = flip.fromParity; s = 1 - ft / 0.5; }
            else                 { renderCells = flip.toCells;   renderParity = flip.toParity;   s = (ft - 0.5) / 0.5; }
            s = Math.max(0.05, s);
            if (flip.diag) { flipDiag = true; flipAng = Math.atan2(flip.dirY, flip.dirX); flipS = s; }
            else { flipSX = flip.axisX ? s : 1; flipSY = flip.axisY ? s : 1; }
            flipAX = flip.hx * CELL;
            flipAY = (flip.hy - game.cameraY) * CELL;
            const sinA = Math.sin(Math.PI * ft);
            if (flip.diag)            flipLift   = 0.18 * CELL * sinA * 0.75;
            else if (flip.dirX !== 0) flipBShear = 0.18 * sinA * flip.dirX * (ft < 0.5 ? 1 : -1);
            else                      flipLift   = 0.18 * CELL * sinA;
        }
    }

    if (!deathFall) {
        const famBase = FAMILY_COLOR[game.shapeType] || '#22d3ee';
        const faceCol = renderParity ? shadeHex(famBase, 0.82) : lightenHex(famBase, 0.16);
        ctx.save();
        if (invuln > now) ctx.globalAlpha = (Math.floor(now / 90) % 2) ? 0.85 : 0.35;
        if (flipping) {
            if (flipLift) ctx.translate(0, -flipLift);
            ctx.translate(flipAX, flipAY);
            if (flipDiag) { ctx.rotate(flipAng); ctx.transform(flipS, 0, 0, 1, 0, 0); ctx.rotate(-flipAng); }
            else          { ctx.transform(flipSX, flipBShear, 0, flipSY, 0, 0); }
            ctx.translate(-flipAX, -flipAY);
        }
        const denyAge = now - deniedT0;
        if (denyAge < 220) ctx.globalAlpha *= 0.55 + 0.45 * (denyAge / 220);

        /* ── THE HANG ───────────────────────────────────────────────────────
           A doomed cube dips, gains a shadow in the well beneath it, and hangs
           for HANG_DUR before it drops and becomes the cell. The brief called
           this the important state because it teaches the rule without a word
           of tutorial, and that is still true — by the time the cube goes, the
           player has seen that it was standing on nothing.

           What it is NOT any more is a reprieve. Input is locked for the beat,
           so you watch the price being paid rather than getting a chance to
           duck it: "snap off, don't give the option of changing your mind". */
        const sagAge = now - sagT0;
        const settle = Math.min(1, sagAge / 260);
        const drop = 5.5 * (1 - Math.cos(settle * Math.PI)) / 2
                   + 1.6 * Math.sin(settle * Math.PI * 2) * (1 - settle);
        const idle = 0.9 * Math.sin(now / 420);

        for (const c of renderCells) {
            const hanging = !flipping && sagging.has(`${c.x},${c.y}`);
            const dipY = hanging ? drop + idle : 0;
            const sx = c.x * CELL + BOX_OFF;
            const sy = (c.y - game.cameraY) * CELL + BOX_OFF;
            if (hanging) {
                /* The dip shadow is clamped to the box too: it shrinks and
                   sinks but never reaches past the cell it belongs to. */
                ctx.save();
                ctx.globalAlpha = 0.42; ctx.fillStyle = '#000'; ctx.filter = 'blur(3px)';
                const shrink = 5 + dipY * 0.6;
                const shY = Math.min(sy + 15 + dipY * 1.5, sy + BOX - (BOX - shrink));
                roundedSq(sx + shrink * 0.5, shY, BOX - shrink, '#000', null);
                ctx.restore();
            }
            roundedSq(sx, sy + dipY, BOX, faceCol, null);
            ctx.save();
            ctx.globalAlpha = 0.5;
            const pIn = 3;
            roundedSq(sx + pIn, sy + dipY + pIn, BOX - pIn * 2, null, shadeHex(famBase, 0.45), 1.5);
            ctx.restore();
        }
        ctx.restore();
    }

    drawPlugs();
    drawCouples();
    drawRings();

    /* THE JOINTS OVERLAY GOES LAST, ON TOP OF EVERYTHING. It used to be drawn
       before the player, which meant the ball dots — which sit exactly on the
       cell corners — were covered by the cubes, since a cube is inset only 4px
       and a dot has a radius of 3.5. The information was all being computed
       and then painted over. */
    if (debugSupport) drawSupportDebug();
    if (showGrid) drawGridRef();

    ctx.restore();
}

/* ── THE JOINTS OVERLAY ────────────────────────────────────────────────────
   A build tool, not a game element. It answers one question — why did that
   press do what it did — and it now answers it only at the moment the question
   is being asked.

       (nothing)     at rest. The board is the board.
       WHITE DOT     while the shape turns: the ball socket actually bearing
                     the turn, with a ring that expands and fades. Only the
                     ones USED — no lattice, no neighbours, no context.
       red dashed    a cube that is about to shear, for the one beat it hangs
       a caption     why the last press was refused, beside the shape

   ── HOW IT GOT HERE ────────────────────────────────────────────────────────
   Four versions, and each removal was right. It started as bright/faint
   colour-coded marks at EVERY intersection saying whether each press could use
   it, which meant reading the answer twice — once off the ticks round the
   shape and once off the lattice — so the eight direction ticks went. Then the
   colour-coding went, because the only intersection whose state you actually
   want is the one you are turning on. Then the permanent lattice went, because
   a map of something that never changes is wallpaper. Then the lines went:
   the spokes and the cardinal hinge axis were the last of them, and on a board
   whose real information is now carried BY lines — hole lips, the underworld
   grid — a diagnostic drawn in lines was competing with the thing it was
   meant to explain.

   What is left is dots, on a move, and one of them brighter. ────────────── */
function drawSupportDebug() {
    if (!game.running) return;
    const cells = getPlayerCells();
    const held = heldCubes(cells);
    const now = performance.now();
    ctx.save();

    /* ── THE LATTICE IS GONE, AND SO ARE ALL THE LINES ────────────────────
       Designer's call, 4 Sep: no line illustrations, and the sockets show only
       when the shape moves.

       What was here: every socket on the board, permanently, drawn as eight
       short spokes — the mark said "a joint with eight locked orientations",
       which was true and was also a hundred-odd little asterisks sitting on the
       board at all times. A permanent map of something that never changes is
       not information, it is wallpaper; and being drawn from LINES it competed
       directly with the two things on this board that are genuinely lines and
       genuinely matter, the hole lips and the underworld grid.

       What replaces it: nothing at rest, and on a move the balls light up as
       DOTS for the length of the turn. You see the joints when the joints are
       doing something, which is the only moment their positions are a question
       you are asking. Drawn below, with the engaged one brighter. ────────── */

    /* ── NOTHING IS DRAWN AROUND A DOOMED CUBE ─────────────────────────────
       There was a red dashed box on any cube about to shear, kept on the
       argument that the beat before a drop is the whole teaching moment. The
       beat is; the box was not. A cube over a hole already DIPS, wobbles on a
       slow idle, and throws a blurred shadow beneath itself — and it does all
       three in ordinary play, with the overlay switched off. The box was a
       fifth marker saying what the movement had already said, and the last
       dashed thing on a board that has had every other outline stripped from
       it.

       A second dashed ring lived here too, for the retired "body wedge" rule,
       behind a flag that had been permanently false since the wedge was
       removed. Gone with it.

       IF THE HANG EVER FAILS TO READ, on the phone or at speed, the fix is to
       treat the CUBE — redden its face, fade it as it lets go — not to draw a
       shape around it. Nothing on this board marks anything from the outside
       any more; state belongs to the object it describes. ────────────────── */
    let lost = 0;
    for (const c of cells) if (!held.has(`${c.x},${c.y}`)) lost++;

    /* WHY THE LAST PRESS DID NOTHING, written beside the shape. */
    if (lastRefusal && now - lastRefusal.t < 1400) {
        const k = (now - lastRefusal.t) / 1400;
        const px = lastRefusal.x * CELL + CELL / 2;
        const py = (lastRefusal.y - game.cameraY) * CELL - 10 - k * 6;
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.font = '700 10px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        const txt = `${lastRefusal.dir} · ${lastRefusal.why}`;
        const w = ctx.measureText(txt).width + 12;
        ctx.fillStyle = lastRefusal.why === 'no socket' ? 'rgba(248,113,113,0.92)'
                                                       : 'rgba(251,191,36,0.92)';
        ctx.fillRect(px - w / 2, py - 11, w, 15);
        ctx.fillStyle = '#0b1220';
        ctx.fillText(txt, px, py);
        ctx.restore();
    }

    /* THE SELECTED JOINT — the only thing on the lattice that is highlighted.
       It is the point the shape is turning about, so it stays put while
       everything else swings around it. Held a moment past the flip so it can
       be caught in a screen grab. */
    {
        const src = flip.active && flip.toCells && !flip.repel
            ? { from: flip.fromCells, to: flip.toCells, t: flip.t0, diag: flip.diag }
            : lastJoint;
        if (src) {
            const age = now - src.t;
            if (age < 900) {
                const k = Math.min(1, age / 900);
                /* ONLY THE BALLS THAT FOUND SOCKETS. A cardinal hinge runs
                   through two grid points and a diagonal through one, but a
                   point with no socket is not a joint — it is just where the
                   hinge line happens to pass. Lighting those was showing a
                   joint in the middle of a 2x2 chasm, which is exactly the
                   place there cannot be one: four hole cells meet there.
                   Now the highlight shows the ball actually bearing the turn,
                   which for a move along the edge of a hole is the one on the
                   rim side. */
                const engaged = contactPoints(src.from, src.to)
                    .filter(([gx, gy]) => socketAt(gx, gy));
                /* WHERE THE HINGE WAS. One engaged ball is a pivot POINT; two
                   or more make an AXIS, and the shape turns about the line
                   between them rather than about either one. Drawn in the same
                   white as the joints because it is the same thing — the joint
                   seen as a whole. Engaged balls of a single press are always
                   collinear (along a grid line for a cardinal, along the
                   anti-diagonal for the two-ball diagonals), so the extremes
                   define it. */
                /* The cardinal hinge AXIS — a white line drawn between two
                   engaged balls — is gone with the rest of the lines. It was
                   the most defensible line on the board (a cardinal press
                   really does fold about that edge) and it is still a line,
                   and the rule now is dots. Nothing is lost: two lit balls a
                   cell apart read as an axis without being joined up.

                   AND THE FAINT BALLS ARE GONE TOO. A pass at this drew every
                   socket the shape's corners touched across both footprints,
                   faint, with the engaged one brighter. Designer's call: just
                   the ball sockets that are USED, nothing else. It was the same
                   mistake as the lattice at smaller scale — sockets you are not
                   turning on are context nobody asked for, and putting them
                   next to the one that matters makes it harder to find, not
                   easier. What is drawn is exactly what bore the turn. */
                for (const [gx, gy] of engaged) {
                    const px = gx * CELL, py = (gy - game.cameraY) * CELL;
                    ctx.save();
                    ctx.globalAlpha = (1 - k) * 0.55;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = (1 - k) * 0.30;
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(px, py, 3 + k * 9, 0, Math.PI * 2); ctx.stroke();
                    ctx.restore();
                }
            }
        }
    }

    ctx.save();
    ctx.fillStyle = 'rgba(249,115,22,0.92)';
    ctx.fillRect(0, 0, 62, 18);
    ctx.fillStyle = '#0b1220';
    ctx.font = '700 10px system-ui, sans-serif';
    ctx.fillText('JOINTS', 8, 13);
    ctx.restore();

    ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('white = the ball socket the turn was made on', 8, LOGICAL_H - 10);
    /* The eight direction ticks that used to ring the shape are gone. They
       said the same thing the joints already say — a press is possible when an
       engaged joint has a socket — and having both meant reading the answer
       twice. openDirections() survives for snapshot(), where it is genuinely
       useful in text. */
    ctx.restore();
}

/* ── GRID REFERENCE, STATE LINE AND REFUSAL LOG ────────────────────────────
   Built so a screen grab is self-describing: anyone looking at it can name any
   cell, and the state line carries everything needed to rebuild that exact
   board — seed, camera row, where you are, what you are. ─────────────────── */
function drawGridRef() {
    const camInt = Math.floor(game.cameraY), camFrac = game.cameraY - camInt;
    ctx.save();
    ctx.font = '600 10px ui-monospace, Menlo, monospace';

    // Column letters, top and bottom edges
    ctx.fillStyle = 'rgba(148,163,184,0.75)';
    ctx.textAlign = 'center';
    for (let x = 0; x < VIEW_W; x++) {
        ctx.fillText(COL[x], x * CELL + CELL / 2, 11);
        ctx.fillText(COL[x], x * CELL + CELL / 2, LOGICAL_H - 22);
    }
    // World row numbers, left edge — they slide with the board, because the
    // label belongs to the row and not to the screen.
    ctx.textAlign = 'left';
    for (let row = 0; row <= VIEW_H; row++) {
        const y = camInt + row;
        const py = (row - camFrac) * CELL + CELL / 2 + 3;
        if (py < 16 || py > LOGICAL_H - 26) continue;
        ctx.fillStyle = 'rgba(148,163,184,0.75)';
        ctx.fillText(String(y), 3, py);
    }
    /* The faint column rules that ran the full height of the board are gone —
       designer's call, keep the cells and nothing else. They were laid down to
       help pick a cell out by eye for a screen grab, but the cells are already
       drawn as discrete rounded squares in their own columns, so the rules were
       re-stating a grid the board was drawing anyway. The letters along the top
       and the numbers down the side still give every cell its reference. */

    // THE STATE LINE — everything needed to reproduce this exact board.
    const seedHex = worldSeed.toString(16).padStart(8, '0');
    const you = cellRef(game.playerX, game.playerY);
    const mv = scrubbing && replay.length ? `move ${replay[scrubIndex].move}/${replayCount} · ` : '';
    const line = `${mv}seed ${seedHex} · cam ${camInt} · you ${you} · `
               + `${SHAPES[game.shapeType].name}/${game.shapeConfig} · `
               + `spent ${game.spent} · lives ${Math.max(0, game.lives)}`;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(11,18,32,0.85)';
    ctx.fillRect(0, LOGICAL_H - 18, LOGICAL_W, 18);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '600 10px ui-monospace, Menlo, monospace';
    ctx.fillText(line, 5, LOGICAL_H - 6);

    // THE REFUSAL LOG — the last few presses that did nothing, and why.
    const now = performance.now();
    refusals = refusals.filter(r => now - r.t < 6000);
    let ry = 30;
    for (const r of refusals) {
        const age = (now - r.t) / 6000;
        ctx.globalAlpha = 1 - age * 0.7;
        ctx.fillStyle = 'rgba(11,18,32,0.8)';
        const txt = `${r.dir} refused at ${r.ref} — ${r.why}`;
        const w = ctx.measureText(txt).width + 10;
        ctx.fillRect(LOGICAL_W - w - 4, ry - 9, w, 14);
        ctx.fillStyle = r.why === 'no socket' ? '#f87171' : '#fbbf24';
        ctx.textAlign = 'right';
        ctx.fillText(txt, LOGICAL_W - 9, ry + 1);
        ry += 16;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

/* ── PAUSE AND STEP ────────────────────────────────────────────────────────
   Paused, the arrow keys and the two buttons walk back and forth through the
   moves you made. Everything on screen — terrain, fills, your shape, and above
   all the grid reference and the state line — comes from the snapshot, so a
   screen grab of move 12 is a screen grab OF move 12. ─────────────────────── */
function togglePause() {
    if (!game.running && !scrubbing) return;
    game.paused = !game.paused;
    if (game.paused) { scrubbing = true; scrubIndex = replay.length - 1; }
    else scrubbing = false;
    const b = document.getElementById('bPause');
    if (b) { b.textContent = game.paused ? 'Resume' : 'Pause';
             b.classList.toggle('on', game.paused); }
    if (!game.paused) lastT = 0;               // do not bill the pause as elapsed
}
function scrubStep(delta) {
    if (!scrubbing || !replay.length) return;
    scrubIndex = Math.max(0, Math.min(replay.length - 1, scrubIndex + delta));
}

/* Draw a past move by swapping it into the live globals, drawing, and putting
   everything back. Nothing updates while paused, so this is safe. */
function drawSnapshot(s) {
    const savedWorld = world, savedVisited = visited, savedFilled = filled;
    const savedSag = sagging, savedRef = refusals, savedFlip = flip;
    const savedDeath = deathFall, savedGame = Object.assign({}, game);
    world = s.world; visited = s.visited; filled = s.filled;
    sagging = s.sagging; refusals = s.refusals;
    flip = { active: false }; deathFall = null;
    Object.assign(game, {
        playerX: s.playerX, playerY: s.playerY,
        shapeType: s.shapeType, shapeConfig: s.shapeConfig,
        faceParity: s.faceParity, cameraY: s.cameraY, spent: s.spent
    });
    draw();
    // The review banner, drawn in the live transform after draw() restores it.
    ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
    ctx.save();
    const label = `REVIEW  move ${s.move} / ${replayCount}   ${s.dir}`;
    ctx.font = '700 11px ui-monospace, Menlo, monospace';
    const w = ctx.measureText(label).width + 18;
    ctx.fillStyle = 'rgba(249,115,22,0.94)';
    ctx.fillRect(LOGICAL_W / 2 - w / 2, 24, w, 20);
    ctx.fillStyle = '#0b1220';
    ctx.textAlign = 'center';
    ctx.fillText(label, LOGICAL_W / 2, 38);
    ctx.restore();
    world = savedWorld; visited = savedVisited; filled = savedFilled;
    sagging = savedSag; refusals = savedRef; flip = savedFlip;
    deathFall = savedDeath; Object.assign(game, savedGame);
}

/* Dump the full scene to the console — the fork's noteSceneSnapshot. Paste the
   output and the exact board can be rebuilt and the press retried. */
function snapshot() {
    const camI = Math.floor(game.cameraY);
    const cells = [];
    for (let y = camI - 1; y < camI + VIEW_H + 1; y++)
        for (let x = 0; x < VIEW_W; x++) {
            const v = world[`${x},${y}`];
            if (v) cells.push([x, y, v]);
        }
    const snap = {
        seed: worldSeed.toString(16),
        cam: camI,
        player: { x: game.playerX, y: game.playerY, ref: cellRef(game.playerX, game.playerY),
                  shape: game.shapeType, config: game.shapeConfig },
        open: openDirections(),
        refusals: refusals.map(r => `${r.dir} at ${r.ref} (${r.why})`),
        world: cells,
        filled: [...persistentFills]
    };
    console.log('%cROTOЯ HOLES — scene snapshot', 'color:#f97316;font-weight:700');
    console.log(JSON.stringify(snap));
    return snap;
}
window.snapshot = snapshot;

/* ── LOOP ──────────────────────────────────────────────────────────────── */
let lastT = 0;
function loop(now) {
    const dt = Math.min(50, now - (lastT || now));
    lastT = now;
    if (game.paused) {
        if (scrubbing && replay.length) drawSnapshot(replay[scrubIndex]);
        else draw();
        requestAnimationFrame(loop);
        return;
    }

    // The hang expires into a drop. Checked here rather than in draw() so the
    // beat has the same length whatever the frame rate is doing.
    if (hangUntil && now >= hangUntil && game.running) dropHung();

    if (game.running && !deathFall) {
        game.elapsed += dt / 1000;
        // Capped. Uncapped, an endless run's ramp never stopped climbing.
        game.speed = Math.min(SPEED_MAX, 1 + game.elapsed * SPEED_RAMP);
        // The pool drains in real time, as main's momentumRemaining() does.
        // No hourglasses in this fork, so it only ever goes down.
        if (!INFINITE_TIME) {
            game.timeLeft -= dt / 1000;
            if (game.timeLeft <= 0) {
                game.timeLeft = 0;
                game.running = false;
                syncClock();
                setTimeout(() => showEnd('time'), 300);
            }
        }
        if ((game._clockTick = (game._clockTick || 0) + dt) > 100) { game._clockTick = 0; syncClock(); }
        if (scrollOn) {
            game.cameraY -= game.speed * dt * SCROLL_RATE * SCROLL_STEPS[scrollStep];
            ensureWorldGenerated(game.cameraY);
        }
        /* Follow, whether or not the scroll is running — with Scroll off you
           still want to be able to climb and meet terrain. */
        {
            const top = Math.min(...getPlayerCells().map(c => c.y));
            const want = top - FOLLOW_MARGIN;
            if (game.cameraY > want) {
                game.cameraY = want;
                ensureWorldGenerated(game.cameraY);
            }
            const botRow = Math.floor(game.cameraY) + VIEW_H - 1;
            if (getPlayerCells().some(c => c.y > botRow + 0.5)) loseLife('edge');
        }
    }
    // Greens are magnetic: touching bonds, checked every frame as in main.
    magneticFuseCheck();
    updateShake();
    draw();
    requestAnimationFrame(loop);
}

/* ── SETUP ─────────────────────────────────────────────────────────────── */
let RENDER_SCALE = 1;
function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const avail = Math.min(window.innerWidth - 16, window.innerHeight - 100);
    const css = Math.max(220, Math.min(LOGICAL_W, avail));
    RENDER_SCALE = (css / LOGICAL_W) * dpr;
    cv.width  = Math.round(LOGICAL_W * RENDER_SCALE);
    cv.height = Math.round(LOGICAL_H * RENDER_SCALE);
    cv.style.width = css + 'px'; cv.style.height = css + 'px';
    const d = document.getElementById('dead');
    d.style.width = css + 'px'; d.style.height = css + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 120));

const SHAPE_CYCLE = ['square', 'jshape', 'diagonal', 'pair', 'single'];
function cycleShape() {
    const i = SHAPE_CYCLE.indexOf(game.shapeType);
    const next = SHAPE_CYCLE[(i + 1) % SHAPE_CYCLE.length];
    game.shapeType = next;
    game.shapeConfig = Object.keys(SHAPES[next].cells)[0];
    syncShapeBtn(); sagging.clear();
    if (game.running) resolveSupport();
}
function syncShapeBtn() {
    document.getElementById('bSize').textContent = 'Shape: ' + SHAPES[game.shapeType].name;
}
function syncLives() {
    const el = document.getElementById('lives');
    if (!el) return;
    let html = '';
    for (let i = 0; i < LIVES_START; i++)
        html += `<i class="${i < game.lives ? '' : 'gone'}"></i>`;
    el.innerHTML = html;
}
function syncClock() {
    syncLives();
    const el = document.getElementById('pips');
    if (INFINITE_TIME) {
        // Counts up. A neutral readout — not a score, and nothing to beat.
        const s = Math.floor(game.elapsed);
        el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        el.className = 'clock free';
        return;
    }
    const t = Math.max(0, game.timeLeft);
    el.textContent = t.toFixed(1) + 's';
    el.className = t <= LOW_TIME ? 'clock low' : 'clock';
}

/* End the run by hand. With the clock off this is the only way a run finishes,
   which is the point: you stop when you have learned something, not when a
   timer decides you have. */
function endRun() {
    if (!game.running && !deathFall) return;
    game.running = false;
    deathFall = null; hangUntil = 0; sagging.clear();
    showEnd('ended');
}
function toggleScroll() {
    scrollOn = !scrollOn;
    const b = document.getElementById('bScroll');
    b.textContent = 'Scroll: ' + (scrollOn ? 'on' : 'off');
    b.classList.toggle('on', !scrollOn);
}
/* Scroll speed on a button, because the right number is a thing you find by
   playing. Whichever step stops feeling wrong is the one that should become
   SCROLL_RATE. */
function cycleSpeed() {
    scrollStep = (scrollStep + 1) % SCROLL_STEPS.length;
    const b = document.getElementById('bSpeed');
    b.textContent = 'Speed: ' + SCROLL_STEPS[scrollStep].toFixed(1) + '×';
    b.classList.toggle('on', scrollStep !== 1);
}
function toggleDebug() {
    debugSupport = !debugSupport;
    document.getElementById('bDbg').classList.toggle('on', debugSupport);
}
function toggleGrid() {
    showGrid = !showGrid;
    document.getElementById('bGrid').classList.toggle('on', showGrid);
}
/* On from the start. The joints are the thing being designed right now, so
   they should not be behind a button you have to know about. */
document.addEventListener('DOMContentLoaded', () => {
    const b = document.getElementById('bDbg');
    if (b) b.classList.toggle('on', debugSupport);
    const gr = document.getElementById('bGrid');
    if (gr) gr.classList.toggle('on', showGrid);
});

/* Restart replays the SAME landscape — same seed — with everything previous
   runs bought already in the ground. newWorld() is the way to a fresh one. */
function restart() {
    world = {}; visited = new Set(); filled = new Map();
    plugs = []; rings = []; couples = []; sagging.clear();
    deathFall = null; flip = { active:false }; pendingResolve = false; hangUntil = 0;
    genTop = 6; rowsSinceFeature = 0; rowsSinceGreen = 0;
    greenState = (worldSeed ^ 0x9e3779b9) >>> 0;
    chasmRows = new Set(); invuln = 0;
    replay = []; replayCount = 0; scrubbing = false; scrubIndex = 0;
    refusals = []; lastRefusal = null; lastJoint = null;
    rngState = worldSeed;
    game = { running:true, cameraY:0, playerX:SPAWN_COL, playerY:5,
             shapeType:game.shapeType || 'square',
             shapeConfig:Object.keys(SHAPES[game.shapeType || 'square'].cells)[0],
             faceParity:false, speed:1, elapsed:0, paused:false,
             timeLeft:CLOCK_START, spent:0, deaths:0, grown:0, lives:LIVES_START };
    ensureWorldGenerated(game.cameraY);
    // Clear only the spawn row and what is below it. The rows ABOVE the player
    // are left exactly as generated, so the first hole is already on screen
    // when the run starts rather than twelve rows away.
    for (let y = 4; y <= 9; y++) for (let x = 0; x < VIEW_W; x++) delete world[`${x},${y}`];
    for (const c of getPlayerCells()) visited.add(`${c.x},${c.y}`);
    syncShapeBtn(); syncClock();
    document.getElementById('dead').classList.remove('show');
}

function newWorld() {
    worldSeed = (Math.random() * 4294967296) >>> 0;
    persistentFills = new Set();
    restart();
}

/* ── SELF-TEST ─────────────────────────────────────────────────────────────
   In the spirit of main's runMovementSelfTest(). Prints the price list the
   design rests on — what each shape pays to cross each kind of hole, and what
   it has left afterwards — so a change to the terrain or the rule shows its
   consequences in the console immediately rather than being discovered forty
   deaths later. Saves and restores all state; touches nothing the player can
   see. ──────────────────────────────────────────────────────────────────── */
function runSupportSelfTest(quiet) {
    const saved = { world, filled, game: Object.assign({}, game), sag: new Set(sagging),
                    flip, deathFall, pendingResolve, hangUntil, plugs: plugs.length };
    /* ENTRY COST — what ONE step into a hole costs this shape, at the best
       anchor it can find.

       This used to be printed as three columns, depth 1 / 2 / 3, and it
       reported the same number in all three for every shape. That was not a
       bug in the measurement; it was the measurement quietly telling us the
       rule had changed underneath it. Depth was a support threshold once, and
       a table with a depth axis made sense. Under "held only if your own cell
       is solid" the entry price is whatever your footprint puts over the edge,
       and depth has nothing to do with it — depth is how many TIMES you pay,
       not how much. One axis, measured live; the other is a multiplier and is
       recorded in the note below. */
    const entryCost = (type, cfg) => {
        world = {};
        for (let r = 0; r < 4; r++)
            for (let x = -2; x < VIEW_W + 2; x++) world[`${x},${3 - r}`] = 'void';
        Object.assign(game, { running: true, cameraY: -2, shapeType: type, shapeConfig: cfg });
        let best = null;
        for (let ay = 0; ay <= 6; ay++) {
            game.playerX = 4; game.playerY = ay;
            const cells = getPlayerCells();
            if (!cells.some(q => isVoid(q.x, q.y))) continue;
            const lost = cells.length - heldCubes(cells).size;
            if (best === null || lost < best) best = lost;
        }
        return best;
    };
    const rows = [];
    for (const [type, cfg] of [['square','A'],['jshape','A'],['diagonal','A'],
                               ['pair','V'],['pair','H'],['single','A']]) {
        const n = SHAPES[type].cells[cfg].length;
        const c = entryCost(type, cfg);
        rows.push({ shape: `${type}/${cfg}`, cubes: n,
                    one_step_in: c === null ? '—' : `${c} cube${c === 1 ? '' : 's'}`,
                    survives: c === null ? '—' : (c >= n ? 'NO — last cube goes' : `yes, as ${n - c}`),
                    ground_bought: c === null ? '—' : c });
    }
    world = saved.world; filled = saved.filled; Object.assign(game, saved.game);
    sagging = saved.sag; flip = saved.flip; deathFall = saved.deathFall;
    pendingResolve = saved.pendingResolve; hangUntil = saved.hangUntil;
    plugs.length = saved.plugs;
    if (!quiet) {
        console.log('%cROTOЯ HOLES — ground costs cubes · build 050926-0810',
                    'color:#f97316;font-weight:700');
        console.log('Two rules, and they answer different questions. MOVEMENT is '
                  + 'ball-and-socket: one socketed ball under an engaged corner is enough '
                  + 'to turn on. SUPPORT is not geometric at all — a cube is held only if '
                  + 'its own cell is solid. Anything you put over a hole fills that cell '
                  + 'and shears off. You do not hang; you pay.');
        (console.table ? console.table(rows) : console.log(rows));
        console.log('%cWORST CASE — a chasm spanning every row, no rim to hug, nothing to '
                  + 'do but pay. Every shape fits a 2x2 and every subset of a 2x2 is a legal '
                  + 'config, so a partial shear ALWAYS leaves a valid smaller shape: the only '
                  + 'way shearing kills is the last cube going in.', 'color:#94a3b8');
        console.log('%cCROSSING COSTS (harness-measured, not computed here) — cubes to get '
                  + 'across a chasm N cells deep:\n'
                  + '    square 2/4/6/8   jshape 1/3/5/6   diagonal 1/2/3/4\n'
                  + '    pair/V 1/2/3/4   pair/H 2/4/x/x   single 1/2/x/x   (x = unaffordable)\n'
                  + 'Note pair/H and pair/V: identical two-cube shapes, opposite prices, and '
                  + 'they INVERT if you cross sideways instead. Orientation is the whole game '
                  + 'now — which is the turn shifter finally earning its place.',
                    'color:#94a3b8');
        console.log('%cAnd a 3-deep moat cannot be crossed in one life at all: past the first '
                  + 'row of void there is no solid cell beside the contact line, so every '
                  + 'deeper move is refused. You get in by falling in — the cubes become the '
                  + 'ground the next attempt pivots on.', 'color:#64748b');
    }
    return rows;
}
window.runSupportSelfTest = runSupportSelfTest;

fit();
restart();
runSupportSelfTest();
requestAnimationFrame(loop);
</script>
